<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>
    <main>
        <section>
            
        </section>
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
        <form action="cadastro.php" method="get">
            <input type="email" name="email" id="iemail" required autocomplete="on" placeholder="seu e-mail"> <br>
            <input type="password" name="senha" id="isenha" required minlength="8" placeholder="sua senha"> <br>
            <input type="submit" value="Entrar" id="entrar"> <br>
            <input type="submit" value="Esqueci a senha" id="recs">
        </form>
    </main>
</body>
</html>
